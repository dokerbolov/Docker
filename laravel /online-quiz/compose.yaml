services:
  server:
    build: .
    container_name: laravel_apache
    ports:
        - "8000:80"
    volumes:
        - .:/var/www/html
    depends_on:
        - mysql

  mysql:
      image: mysql:8
      container_name: laravel_mysql
      restart: always
      environment:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quiz
      ports:
          - "3306:3306"


